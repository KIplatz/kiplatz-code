name: Tests on Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up
        run: python node-agent/entwickeln.py setup
      - name: Tests
        run: python node-agent/entwickeln.py test
      - name: Build the helper packages from source
        run: python node-agent/entwickeln.py build
